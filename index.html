<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'sha256-sVkqs5LAc0vTNuUTj8SJZGx3nCEHH/w5vHjrYeIK5BM='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Signal</title>
<style>
:root{--bg:#060b0d;--ink:#d9ece8;--dim:#7f9b97;--cyan:#5ad8c8;--line:rgba(90,216,200,.07)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;line-height:1.6;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),radial-gradient(ellipse at 50% 30%,rgba(90,216,200,.08),transparent 60%);
background-size:48px 48px,48px 48px,100% 100%}
.wrap{min-height:100vh;display:flex;flex-direction:column;max-width:64rem;margin:0 auto;padding:1.5rem 1.5rem 2.5rem}
header{color:var(--dim);font-size:.8rem;letter-spacing:.04em}
header span{color:var(--cyan)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:3rem;align-items:center;padding:3rem 0}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(1.9rem,4.6vw,3.2rem);line-height:1.25;color:var(--ink);text-shadow:0 0 28px rgba(90,216,200,.22);border-left:2px solid var(--cyan);padding-left:1.25rem}
figure{margin:0;justify-self:center;max-width:20rem}
figure img{display:block;width:100%;height:auto;border:1px solid rgba(90,216,200,.25);border-radius:2px;box-shadow:0 0 40px rgba(90,216,200,.12)}
figcaption{margin-top:.9rem;text-align:center;color:var(--cyan);font-size:.95rem}
footer{color:var(--dim);font-size:.75rem}
@media (max-width:700px){main{grid-template-columns:1fr;gap:2rem;padding:2rem 0}h1{padding-left:1rem}}
</style>
</head>
<body>
<div class="wrap">
<header><span>&gt;</span> signal / 001</header>
<main>
<h1>You see ‌‌‌‌‌‌‌⁠‌⁠​‍‌⁠⁠⁠‌⁠​‍‌⁠⁠‍‌⁠‌​‌⁠‍‍‌⁠‍‍‌‌‍‍‌⁠​​‌‌⁠⁠‌‌⁠‍‌⁠​⁠‌⁠‍‍‌‌‍‍‌⁠​‍‌‌​​‌⁠‌‌what I have written. But have I written only what you see?</h1>
<figure>
<img src="wizard.png" width="640" height="800" alt="A mysterious wizard in a dark hooded cloak and pointed hat, eyes glowing in the shadow of the hood, holding a luminous staff beneath a pale moon.">
<figcaption>seek and ye shall find</figcaption>
</figure>
</main>
<footer>look closer</footer>
</div>
</body>
</html>
